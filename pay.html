<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway - Just Consult Adrian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('jca_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-lg font-extrabold text-white">
                Just Consult <span class="text-amber-400">Adrian</span>
            </a>
            <a href="index.html" class="text-xs text-gray-400 hover:text-white transition">← Return to Site</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-12 w-full">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <span class="text-xs font-mono text-amber-400 bg-amber-400/10 border border-amber-400/20 px-3 py-1 rounded-full uppercase">
                    Secure Payment Engine
                </span>
                <h1 class="text-2xl font-extrabold text-white">Settle Retainer / Invoice</h1>
                <p class="text-xs text-gray-400">Accepting EcoCash, OneMoney &amp; Mobile Banking (USD)</p>
            </div>

            <form action="https://www.paynow.co.zw/Payment/BillPaymentLink" method="POST" class="space-y-4">
                
                <!-- PRE-CONFIGURED PAYNOW INTEGRATION ID -->
                <input type="hidden" name="search" value="26258">

                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase mb-1">Invoice / Reference ID</label>
                    <input type="text" name="reference" required placeholder="e.g. INV-1001 or Client Name" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:border-amber-400 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase mb-1">Amount (USD)</label>
                    <input type="number" name="amount" step="0.01" required placeholder="0.00" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-4 py-3 text-xs text-white focus:border-amber-400 outline-none">
                </div>

                <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-gray-950 font-bold text-xs uppercase py-4 rounded-xl transition shadow-xl mt-4">
                    Proceed to EcoCash / Mobile Payment →
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-gray-900 py-6 text-center text-xs text-gray-500">
        © 2026 Just Consult Adrian • Secure Mobile Payment Gateway
    </footer>

</body>
</html>
